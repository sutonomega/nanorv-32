name: Specification contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record Python version
        run: python3 --version
      - name: Check protocol vectors
        run: python3 docs/protocol-vectors.py
